# Compression for text responses.
#
# Ubuntu's nginx.conf enables `gzip on` but leaves gzip_types commented out,
# and the built-in default is text/html only — so stylesheets, scripts and API
# JSON were all being sent uncompressed. Installed to /etc/nginx/conf.d/ so it
# applies at the http level without touching the certbot-managed site config.
#
# Images are already compressed formats and are deliberately not listed;
# gzipping them wastes CPU for no gain.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;
