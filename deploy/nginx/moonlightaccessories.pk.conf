# Moonlight Accessories — nginx site config
# Install: /etc/nginx/sites-available/moonlightaccessories.pk
#
# Serves the frontend statically, the admin panel same-origin, and proxies
# the API to the Node process on 127.0.0.1:5000.
#
# Certbot rewrites this file when TLS is issued (adds the 443 server block
# and the http->https redirect). Run provision.sh before certbot.

server {
    listen 80;
    listen [::]:80;
    server_name moonlightaccessories.pk www.moonlightaccessories.pk;

    # Uploads can be up to MAX_FILE_SIZE_MB (10) — nginx defaults to 1M and
    # would reject product images with a 413 before they ever reach Node.
    client_max_body_size 12M;

    access_log /var/log/nginx/moonlight.access.log;
    error_log  /var/log/nginx/moonlight.error.log;

    # ── Frontend ──────────────────────────────────────────
    root /var/www/moonlight-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Admin panel (lives in the backend repo) ───────────
    # admin.html hardcodes API_BASE = '/api/v1', so it only works same-origin.
    location = /admin {
        alias /var/www/moonlight-backend/admin.html;
        default_type text/html;
    }

    # ── Product images ────────────────────────────────────
    # Node also serves these via express.static, but nginx off disk is cheaper.
    location /uploads/ {
        alias /var/www/moonlight-backend/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
